<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">TEREM — a fairy-tale security team</title>
<desc id="desc">Eight cheerful fairy-tale companions gather around a carved wooden terem in a twilight forest: Vasilisa with a guiding star, Volk the wolf, Yaga with a key, three-headed Gorynych, leafy Leshy, Koschei with a secret egg, a smiling Mirror, and learned Kot with a book. Warm windows, mushrooms and fireflies light their meeting.</desc>
